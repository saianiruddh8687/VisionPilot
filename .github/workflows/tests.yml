name: VisionPilot tests

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q visionpilot tests
      - name: Import desktop dashboard
        run: python -c "from visionpilot.dashboard import DashboardWindow; from visionpilot.dashboard_runtime import DashboardWorker"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpilot"
version = "0.6.0"
description = "Local hand tracking, gesture recognition, calibrated desktop control, and a PySide6 dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<2",
  "pynput>=1.7.7,<2",
  "PySide6>=6.7,<7",
]

[project.scripts]
visionpilot = "visionpilot.dashboard:main"
visionpilot-cli = "visionpilot.app:run"

[tool.setuptools.packages.find]
include = ["visionpilot*"]

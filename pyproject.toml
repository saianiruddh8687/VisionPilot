[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpilot"
version = "0.2.0"
description = "Local webcam hand perception and fingertip motion tracking engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
include = ["visionpilot*"]
